html,body{position:fixed;inset:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;letter-spacing:-.015em;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
/* UI chrome never scales with browser zoom gestures */
#side,header,#lay,#tb,#mediaBar,#note,#ps,#zm,#md,#linkHint,#ts{touch-action:manipulation;zoom:1}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:10px;transition:background .15s,color .15s,transform .15s var(--sp),opacity .15s}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,.n:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:10px;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}

#app{display:flex;position:fixed;inset:0;height:auto;width:100%}
#side{width:260px;background:var(--pn);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex:none;z-index:20}
main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}

.sh{display:flex;align-items:center;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 14px}
.sh b{font-size:18px;font-weight:700;letter-spacing:-.04em;display:flex;align-items:center;gap:8px}
.sh b span{background:linear-gradient(100deg,#0a84ff,#bf5af2);-webkit-background-clip:text;background-clip:text;color:transparent}
#nw{width:34px;height:34px;border-radius:11px;background:var(--ac);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(10,132,255,.3)}
#nw:hover{background:var(--ac2);transform:translateY(-1px)}
.cap{padding:10px 16px 6px;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--mu);text-transform:uppercase}
#files{flex:1;overflow:auto;padding:4px 8px 12px}
.f{display:flex;align-items:center;gap:6px;min-height:40px;padding:4px 8px 4px 10px;border-radius:11px;cursor:pointer;color:var(--mu);margin:2px 0;transition:background .15s,color .15s}
.f:hover{background:rgba(255,255,255,.04);color:var(--fg)}
.f.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);font-weight:600}
.f .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;outline:0}
.f .nm[contenteditable]{background:var(--bg);padding:4px 6px;border-radius:6px}
.f button{width:26px;height:26px;opacity:0;display:grid;place-items:center;border-radius:7px;color:var(--mu)}
.f:hover button,.f.on button{opacity:.7}
.f button:hover{opacity:1;background:rgba(255,255,255,.06)}
.f button.red{width:auto;padding:0 8px;color:#ff453a;font-weight:600;opacity:1;font-size:12px}
.sf{padding:12px}
.sf button{width:100%;height:40px;border:1px solid var(--bd);border-radius:11px;font-size:13px;font-weight:600;color:var(--mu);display:flex;align-items:center;justify-content:center;gap:7px}
.sf button:hover{background:rgba(255,255,255,.04);color:var(--fg);border-color:rgba(255,255,255,.14)}

header{position:absolute;top:0;left:0;right:0;z-index:10;height:calc(54px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:4px;padding:env(safe-area-inset-top,0px) 12px 0 10px;background:linear-gradient(to bottom,var(--pn) 70%,transparent);pointer-events:none;box-sizing:border-box}
header>*{pointer-events:auto}
header h1{font-size:14px;font-weight:650;margin:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
header button{width:34px;height:34px;border-radius:10px;color:var(--mu);display:grid;place-items:center}
header button:hover{background:rgba(255,255,255,.06);color:var(--fg)}
#sq{height:32px;width:110px;padding:0 12px;border-radius:9px;font-size:13px;background:rgba(255,255,255,.05);border-color:transparent;transition:width .2s,background .2s}
#sq:focus{width:160px;background:var(--pn);border-color:var(--bd)}
#mb{display:none}

.wrap{flex:1;position:relative;min-height:0}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--bg)}
#stage.is-interacting{cursor:grabbing}
#stage.link-mode{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#lk{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#lk path{fill:none;stroke-linecap:round;opacity:.85}
#lk path.free{stroke-dasharray:6 4;opacity:.9}
#lk path.free-arrow{opacity:1}

.n{
  position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:10px 16px;border-radius:14px;cursor:pointer;user-select:none;-webkit-user-select:none;
  line-height:1.3;--c:var(--ac);--t:#fff;font-weight:600;
  transition:box-shadow .18s var(--sp),filter .18s,opacity .2s,transform .18s;
  box-shadow:0 2px 8px rgba(0,0,0,.25);gap:4px;
}
.n .tx{outline:0;max-width:100%;overflow-wrap:anywhere}
.n .tx[contenteditable]{user-select:text;-webkit-user-select:text;cursor:text}
.n .nico{font-size:1.25em;line-height:1;display:block}
.n .nimg{max-width:100%;max-height:72px;border-radius:8px;object-fit:cover;display:block}
.n .nlink{font-size:11px;font-weight:500;opacity:.75;text-decoration:underline;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n.d0{font-size:20px;font-weight:700;border-radius:22px;color:var(--t);background:linear-gradient(155deg,color-mix(in srgb,var(--c) 88%,#fff),var(--c) 50%,color-mix(in srgb,var(--c) 75%,#000));box-shadow:0 12px 32px color-mix(in srgb,var(--c) 28%,transparent),inset 0 1px 0 rgba(255,255,255,.22)}
.n.d1{font-size:17px;font-weight:600;border-radius:17px;color:var(--t);background:linear-gradient(175deg,color-mix(in srgb,var(--c) 92%,#fff),var(--c));box-shadow:0 7px 20px color-mix(in srgb,var(--c) 22%,transparent),inset 0 1px 0 rgba(255,255,255,.18)}
.n.dx{font-size:15.5px;font-weight:500;border-radius:14px;color:var(--fg);background:color-mix(in srgb,var(--c) 11%,var(--pn));border:1px solid color-mix(in srgb,var(--c) 38%,transparent);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.n.sel{box-shadow:0 0 0 2px var(--ac),0 0 0 6px color-mix(in srgb,var(--ac) 22%,transparent),0 12px 32px rgba(0,0,0,.4)!important;z-index:8}
.n.dragging{opacity:.9;filter:brightness(1.1);box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:30;transition:none;pointer-events:none}
.n:hover{filter:brightness(1.05);z-index:5}
.n.dim{opacity:.15}.n.hit{box-shadow:0 0 0 3px #facc15}
.n.link-target{box-shadow:0 0 0 3px #30d158,0 0 0 7px rgba(48,209,88,.25)!important}
.cb{position:absolute;right:-7px;top:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:7px;background:var(--pn);border:1.5px solid var(--c);color:var(--fg);font:600 10px/1 system-ui;display:grid;place-items:center}
.n.task-done{box-shadow:inset 0 0 0 2px #22c55e,0 6px 20px rgba(34,197,94,.12)!important}
.n.task-progress{box-shadow:inset 0 0 0 2px #eab308,0 6px 20px rgba(234,179,8,.12)!important}
.n.task-todo{box-shadow:inset 0 0 0 2px #ef4444,0 6px 20px rgba(239,68,68,.12)!important}

#world[data-sh=p] .n{border-radius:999px}
#world[data-sh=b] .n{border-radius:4px}
#world[data-sh=c] .n{border-radius:50%;padding:6px 8px}
#world[data-ns=flat] .n.d0,#world[data-ns=flat] .n.d1{background:var(--c);box-shadow:0 5px 16px color-mix(in srgb,var(--c) 25%,transparent)}
#world[data-ns=line] .n.d0,#world[data-ns=line] .n.d1{background:var(--pn);color:var(--fg);border:2px solid var(--c);box-shadow:none}
#world[data-ns=glass] .n{background:color-mix(in srgb,var(--c) 22%,transparent)!important;backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,var(--c) 55%,#fff);color:var(--fg)!important}
#world[data-ns=neon] .n{background:#0a0a0f!important;color:#fff!important;border:1.5px solid var(--c);box-shadow:0 0 16px var(--c),inset 0 0 10px color-mix(in srgb,var(--c) 35%,transparent)}
#world[data-ns=soft] .n{background:color-mix(in srgb,var(--c) 16%,var(--pn))!important;color:var(--fg)!important;border:0;box-shadow:5px 5px 12px rgba(0,0,0,.3),-3px -3px 10px rgba(255,255,255,.03)}

/* Natural style: no boxes, underline in branch colour */
#world[data-ns=nat] .n.d1,#world[data-ns=nat] .n.dx{background:transparent!important;border:0;border-bottom:3px solid transparent;border-radius:0!important;box-shadow:none;color:var(--fg)!important;padding:4px 8px;backdrop-filter:none}
#world[data-ns=nat] #lk path:not(.free){stroke-linecap:butt;opacity:1}
#world[data-ns=nat][data-an='2'] #lk path:not(.free){stroke-dasharray:none;animation:none}
#world[data-ns=nat] .n.d0{background:#141418;color:var(--fg);border:2px solid var(--c);box-shadow:none}
/* Fill modes: per-node (n.fill) or global (Оформление → Заливка) */
#world[data-ns] .n.fill-solid{background:var(--c)!important;color:var(--t)!important;border:1px solid transparent!important;backdrop-filter:none;box-shadow:0 5px 16px color-mix(in srgb,var(--c) 28%,transparent)}
#world[data-ns=grad] .n.fill-solid{background:linear-gradient(175deg,color-mix(in srgb,var(--c) 92%,#fff),var(--c))!important}
#world[data-ns] .n.fill-line{background:var(--pn)!important;color:var(--fg)!important;border:2px solid var(--c)!important;backdrop-filter:none;box-shadow:none}

#lay{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:2px;padding:3px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35);max-width:calc(100% - 24px);overflow-x:auto}
#lay button{padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--mu);white-space:nowrap}
#lay button:hover{color:var(--fg)}
#lay button.on{background:rgba(255,255,255,.08);color:var(--fg)}

/* Bottom dock — minimal, unified style */
#tb{
  position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:9;
  padding:6px;max-width:calc(100% - 16px);
  background:var(--pn);border:1px solid var(--bd);border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.45);
}
#tb .row{display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:nowrap}
#tb .grp{display:flex;align-items:center;gap:2px}
#tb .sep{width:1px;height:18px;background:var(--bd);margin:0 5px;flex:none}
#tb button{
  height:34px;width:34px;min-width:34px;padding:0;border-radius:9px;
  color:var(--mu);display:inline-flex;align-items:center;justify-content:center;flex:none;
}
#tb button:hover{background:rgba(255,255,255,.07);color:var(--fg)}
#tb button.danger:hover{background:rgba(255,69,58,.12);color:#ff453a}
#tb button.on{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac)}
#tb .sw{display:flex;align-items:center;gap:5px;padding:0 4px}
#tb i{
  width:18px;height:18px;border-radius:6px;cursor:pointer;flex:none;
  border:1.5px solid rgba(255,255,255,.12);
  transition:transform .12s,border-color .12s,box-shadow .12s;
}
#tb i:hover{transform:scale(1.08);border-color:rgba(255,255,255,.35)}
#tb i.on{border-color:var(--fg);box-shadow:0 0 0 2px rgba(255,255,255,.1)}
#tb i.rs{
  background:
    linear-gradient(45deg,transparent 46%,var(--mu) 46%,var(--mu) 54%,transparent 54%),
    linear-gradient(-45deg,transparent 46%,var(--mu) 46%,var(--mu) 54%,transparent 54%);
  background-color:rgba(255,255,255,.04);
}
#tb input[type=color]{
  width:18px;height:18px;border:1.5px solid rgba(255,255,255,.12);padding:0;
  background:none;cursor:pointer;border-radius:6px;flex:none;overflow:hidden;
}
#tb input[type=color]::-webkit-color-swatch-wrapper{padding:0}
#tb input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
#tb .ic{width:16px;height:16px}

#mediaBar{position:absolute;bottom:calc(58px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:9;
  display:flex;gap:6px;align-items:center;padding:8px 10px;
  background:var(--pn);border:1px solid var(--bd);border-radius:12px;
  box-shadow:0 8px 28px rgba(0,0,0,.4);width:min(480px,calc(100% - 16px));flex-wrap:wrap;justify-content:center;
}
#mediaBar input[type=text]{height:30px;padding:0 10px;font-size:12px;min-width:100px;flex:1}
#mediaBar .icons{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
#mediaBar .icons button{width:28px;height:28px;font-size:14px;border-radius:7px;color:var(--fg)}
#mediaBar .icons button:hover{background:rgba(255,255,255,.08)}
#note{position:absolute;bottom:calc(100px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:9;
  width:min(360px,calc(100% - 16px));
  background:var(--pn);border:1px solid var(--bd);border-radius:12px;
  padding:8px 10px;box-shadow:0 8px 28px rgba(0,0,0,.4);
}
#note textarea{
  width:100%;min-height:40px;max-height:88px;resize:vertical;border:0;
  background:transparent;padding:2px 4px;font-size:13px;line-height:1.4;color:var(--fg);
}
#note textarea::placeholder{color:var(--mu)}

#ps{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:min(300px,calc(100% - 24px));max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;z-index:12;background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 16px 48px rgba(0,0,0,.5);animation:in .2s var(--sp) both}
#ps>b{display:block;font-size:14px;font-weight:700;margin-bottom:12px}
#ps .cap{padding:12px 0 6px;font-size:10px}
.bgs{display:flex;flex-wrap:wrap;gap:7px}
.bgs i,.up{width:30px;height:30px;border-radius:9px;cursor:pointer;border:2px solid var(--bd);display:grid;place-items:center;position:relative;transition:transform .12s,border-color .12s}
.bgs i.on{border-color:var(--ac)}
.bgs i:hover,.up:hover{transform:translateY(-1px)}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ch{display:flex;flex-wrap:wrap;gap:5px}
.ch button{padding:6px 11px;border:1px solid var(--bd);border-radius:8px;font-size:12px;font-weight:600;color:var(--mu)}
.ch button:hover{border-color:rgba(255,255,255,.18);color:var(--fg)}
.ch button.on{background:var(--ac);color:#fff;border-color:var(--ac)}

#zm{position:absolute;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;flex-direction:column;border-radius:11px;overflow:hidden;border:1px solid var(--bd);background:var(--pn);box-shadow:0 6px 20px rgba(0,0,0,.3)}
#zm button{width:34px;height:34px;color:var(--mu);display:grid;place-items:center}
#zm button+button{border-top:1px solid var(--bd)}
#zm button:hover{background:rgba(255,255,255,.05);color:var(--fg)}

#list{position:absolute;inset:0;overflow:auto;padding:calc(100px + env(safe-area-inset-top,0px)) max(16px,calc((100% - 640px)/2)) calc(40px + env(safe-area-inset-bottom,0px))}
.row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.row input{flex:1;min-height:40px;padding:8px 12px;border-radius:11px;font-size:14.5px;font-weight:500;border-color:var(--bd);background:var(--pn)}
.row input.rt{font-weight:700;font-size:16px}
.row .dot{width:8px;height:8px;border-radius:50%;flex:none}
.row button{width:32px;height:34px;color:var(--mu);display:grid;place-items:center;border-radius:8px}
.row button:hover{background:rgba(255,255,255,.05);color:var(--fg)}

#md{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(10px)}
#md .box{background:var(--pn);border:1px solid var(--bd);border-radius:18px;padding:22px;width:min(480px,100%);box-shadow:0 24px 80px rgba(0,0,0,.55);animation:in .2s var(--sp) both}
#md h3{font-size:17px;font-weight:700;margin-bottom:4px}
#md p{color:var(--mu);font-size:13.5px;line-height:1.5;margin-bottom:14px}
#md textarea{width:100%;height:220px;resize:none;padding:12px;font:13px/1.55 ui-monospace,Menlo,monospace;border-radius:12px}
.bt{display:flex;gap:7px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
.bt button{padding:9px 14px;border:1px solid var(--bd);border-radius:10px;font-size:13px;font-weight:600;color:var(--mu)}
.bt button:hover{background:rgba(255,255,255,.05);color:var(--fg)}
.bt .pr{background:var(--ac);color:#fff;border-color:var(--ac)}
.bt .pr:hover{background:var(--ac2)}

#ts{position:absolute;bottom:78px;left:50%;transform:translate(-50%,12px);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:15}
#ts.on{opacity:1;transform:translate(-50%,0)}
#scrim{display:none}
#linkHint{position:absolute;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:11;background:#30d158;color:#000;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:650;box-shadow:0 6px 20px rgba(48,209,88,.35)}

.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
header .ic,#zm .ic,.sh .ic{width:17px;height:17px}
.f .ic,.row .ic{width:15px;height:15px}
#tb .ic{width:16px;height:16px}


#sg{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column}
#sg .hd{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
#sg .hd b{font-size:18px;font-weight:700;flex:1}
#sg .hd button{width:40px;height:40px;display:grid;place-items:center;background:var(--pn);border:1px solid var(--bd);border-radius:12px}
#sgl{flex:1;overflow:auto;padding:6px 16px calc(28px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;align-content:start;grid-auto-rows:max-content}
.sc{display:flex;flex-direction:column;flex:none;border:2px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--pn);transition:border-color .15s,transform .15s var(--sp)}
.sc:active{transform:scale(.985)}
.sc svg{display:block;flex:none;width:100%;height:auto;aspect-ratio:320/186;background:#181818}
.sc span{display:block;flex:none;text-align:center;padding:10px 6px;font-size:15px;font-weight:600}
.sc.on{border-color:var(--ac)}.sc.on span{background:var(--ac);color:#fff}

@keyframes in{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fl{to{stroke-dashoffset:-.05}}
#world:not([data-an='0']) .n.pop{animation:pop .55s cubic-bezier(.2,1.25,.4,1) backwards}
#world:not([data-an='0']) #lk path.dr{stroke-dasharray:1;animation:dr .6s ease backwards}
#world[data-an='2'] #lk path:not(.free){stroke-dasharray:.02 .02;animation:fl 1.3s linear infinite}
#world.sm{transition:transform .5s var(--sp)}
#stage.sm{transition:background-position .5s var(--sp),background-size .5s var(--sp)}

@media(max-width:720px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:30;width:min(280px,85vw);transform:translateX(-105%);transition:transform .22s var(--sp);box-shadow:8px 0 40px rgba(0,0,0,.5)}
  #side.open{transform:none}
  #scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}
  #mb{display:grid}
  header{height:calc(50px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 8px 0}
  header h1{font-size:13px;margin:0 4px}
  #sq{width:70px}#sq:focus{width:110px}
  #lay{top:calc(56px + env(safe-area-inset-top,0px))}
  #tb{bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:5px 6px;width:calc(100% - 12px);border-radius:12px}
  #tb button{height:30px;width:30px;min-width:30px}
  #tb .row{flex-wrap:wrap}
  #mediaBar{bottom:calc(50px + env(safe-area-inset-bottom,0px))}
  #note{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  #zm{right:8px;bottom:calc(62px + env(safe-area-inset-bottom,0px))}

/* PWA: в standalone-режиме приложение рисуется под статус-бар,

<script>
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone===true)document.documentElement.classList.add('sa');
const $=i=>document.getElementById(i);
const PAL=['#0a84ff','#bf5af2','#ff9f0a','#30d158','#64d2ff','#ff453a','#ff375f','#ffd60a','#5e5ce6','#ac8e68'];
const ACC='#0a84ff';
const LAYS=[['map','Карта'],['right','Вправо'],['down','Вниз'],['radial','Радиал'],['list','Список']];
const DF={ns:'grad',sh:'r',ln:0,ft:0,an:1,gr:0,fl:0,pal:'bright',dk:0};
const BASE=d=>d?d==1?17:15.5:20;
const PALS={
  bright:{n:'Яркая',r:ACC,b:PAL},
  rainbow:{n:'Радуга',r:'#4a52c4',b:['#ff1f1f','#ff8a00','#ffd400','#9be000','#7dff00','#18d060','#0fb4ff','#3a5bff']},
  steel:{n:'Сталь',r:'#5560d8',b:['#4047b0','#4b52c2','#363c9c','#3d44ab']},
  aqua:{n:'Аква',r:'#1e90d0',b:['#1e88c4','#2596be','#1f7fb5','#1a78a6']},
  spring:{n:'Весна',r:'#3aa6a0',b:['#6fb812','#5fa81a','#7cc21a','#4f9a1e'],l:'#f0c808'},
  gold:{n:'Золото',r:'#d4af00',b:['#b8960c','#a07f10','#c9a800','#8f7014']},
  pastel:{n:'Пастель',r:'#c28a3a',b:['#d6455d','#4f93b8','#c9a227','#9b59b6','#4caf7a','#e0709a','#8a6fd6']},
  circles:{n:'Круги',r:'#7ec8ff',b:['#ff6b6b','#ffb347','#ffe66d','#c5e99b','#6fd6c5','#8fd3a0','#f4a3b5']},
  gray:{n:'Серая',r:'#a1a1aa',b:['#d4d4d8','#c4c4ca']},
  mono:{n:'Ч/Б',r:'#e4e4e7',b:['#e4e4e7']}
};
const EMOJIS=['💡','🔥','⭐','✅','❌','🎯','📌','🔗','📊','🧠','⚙️','🚀','📝','💬','❤️','⚠️'];
const I=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const uid=()=>Math.random().toString(36).slice(2,9);
const T=(t,c=[])=>({id:uid(),text:t,children:c.map(x=>typeof x=='string'?T(x):x)});
const rep=(k,v)=>k[0]=='_'?undefined:v;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mkMap=(name,root)=>({id:uid(),name,layout:'map',root,view:null,o:{...DF},links:[]});

let S,sel=null,H=[],hi=-1,ned=null,foc=null,v={x:0,y:0,k:1},tm,lastTap={},seen=new Set(),bb=null;
let linkFrom=null,showMedia=false;
const ctx=document.createElement('canvas').getContext('2d'),st=$('stage');

try{S=JSON.parse(localStorage.getItem('mm2'))}catch(e){}
if(!S||!S.maps||!S.maps.length){
  S={cur:null,maps:[mkMap('Мой проект',T('Мой проект',[
    T('Идеи',['Мозговой штурм','Референсы','Прототип']),
    T('Задачи',[T('Сегодня',['Написать план','Созвон']),'На неделе']),
    T('Ресурсы',['Бюджет','Люди','Инструменты']),
    T('Цели',['Запуск','Рост'])
  ]))]};
}
S.maps.forEach(m=>{if(!m.o)m.o={...DF};if(!m.links)m.links=[]});

const cur=()=>S.maps.find(m=>m.id==S.cur)||S.maps[0];
const links=()=>cur().links||(cur().links=[]);
const save=()=>{try{localStorage.setItem('mm2',JSON.stringify(S,rep))}catch(e){}};
const walk=(n,d,p,f,i=0)=>{f(n,d,p,i);if(!n.collapsed)n.children.forEach((c,j)=>walk(c,d+1,n,f,j))};
const find=(id,n=cur().root,p=null)=>{if(n.id==id)return{n,p};for(const c of n.children){const r=find(id,c,n);if(r)return r}};
const allNodes=()=>{const a=[];walk(cur().root,0,null,n=>a.push(n));return a};
const nodeById=id=>{const f=find(id);return f?f.n:null};
const cnt=n=>n.children.reduce((a,c)=>a+1+cnt(c),0);
const lum=h=>(.299*parseInt(h.slice(1,3),16)+.587*parseInt(h.slice(3,5),16)+.114*parseInt(h.slice(5,7),16))/255;

const shade=(h,k)=>k?'#'+[1,3,5].map(i=>Math.round(parseInt(h.slice(i,i+2),16)*(1-k)).toString(16).padStart(2,'0')).join(''):h;
function snap(){
  const s=JSON.stringify({r:cur().root,l:links()},rep);
  if(H[hi]===s)return;
  H=H.slice(0,hi+1);H.push(s);hi++;
  if(H.length>80){H.shift();hi--}
  save();
}
const go=d=>{
  if(!H[hi+d])return;
  hi+=d;
  const data=JSON.parse(H[hi]);
  cur().root=data.r;cur().links=data.l||[];
  if(!find(sel))sel=null;
  render();save();
};
const mut=f=>{f();snap();render()};

const O=()=>cur().o||(cur().o={...DF});
const FONTS=[['Системный','system-ui,-apple-system,"Segoe UI",sans-serif'],['Антиква','Georgia,serif'],['Моно','ui-monospace,Menlo,monospace']];
const FT=()=>FONTS[O().ft||0][1];

function dims(n,d){
  const base=BASE(d),fs=Math.max(10,Math.min(36,n.fs||base));
  const weight=n.bold?700:(d?d==1?600:500:700);
  ctx.font=`${weight} ${fs}px ${FT()}`;
  const m=ctx.measureText(n.text||' ').width;
  const mw=Math.max(O().sh=='c'?72:100,(d?200:230)*(fs/base)*(O().sh=='c'?.6:1));
  const ln=Math.max(1,Math.ceil(m/mw));
  let extraH=0;
  if(n.icon)extraH+=fs*1.15+4;
  if(n.img)extraH+=76;
  if(n.href)extraH+=16;
  const nat=O().ns=='nat'&&d>0,tw=Math.min(m+4,mw+4);
  n._w=Math.round(tw+(nat?24:d?36:52));
  if(n.img)n._w=Math.max(n._w,120);
  n._h=Math.round(ln*(fs*1.32)+(nat?14:d?22:32)+extraH);
  if(O().sh=='c'&&!nat){const sd=Math.max(n.img?120:0,52,Math.round(Math.hypot(tw,n._h-(d?22:32))+16));n._w=n._h=sd}
}
const prep=r=>{const P=PALS[O().pal]||PALS.bright;walk(r,0,null,(n,d,p,i)=>{n._c=n.color||(d==0?P.r:d==1?P.b[i%P.b.length]:(d==2&&P.l&&!p.color?P.l:p._c));dims(n,d)})};

function sub(n,t){
  const gap=t?22:16,B=t?n._w:n._h;
  if(n.collapsed||!n.children.length)return n._s=B+gap;
  return n._s=Math.max(B+gap,n.children.reduce((a,c)=>a+sub(c,t),0));
}
function place(n,dc,b0,s,t){
  const b=b0+n._s/2;
  n._x=Math.round(t?b:dc);n._y=Math.round(t?dc:b);
  if(n.collapsed||!n.children.length)return;
  const gap=t?52:58,D=t?n._h:n._w;
  const childSum=n.children.reduce((a,c)=>a+c._s,0);
  let o=b0+(n._s-childSum)/2;
  n.children.forEach(c=>{place(c,dc+s*(D/2+gap+(t?c._h:c._w)/2),o,s,t);o+=c._s});
}
const lv=n=>n._l=(n.collapsed||!n.children.length)?1:n.children.reduce((a,c)=>a+lv(c),0);
function radR(r){
  const mw=[],mh=[];
  walk(r,0,null,(n,d)=>{mw[d]=Math.max(mw[d]||0,n._w);mh[d]=Math.max(mh[d]||0,n._h)});
  lv(r);
  const L=Math.max(1,r._l),R=[0],ext=d=>.7*mw[d]+.3*mh[d];
  for(let d=1;d<mw.length;d++){
    const byRing=R[d-1]+ext(d-1)/2+ext(d)/2+40;
    const byArc=((2*mh[d]+mw[d])/3+14)*L/(2*Math.PI);
    R[d]=Math.round(Math.max(byRing,byArc));
  }
  return R;
}
function rad(n,a0,a1,d,R){
  const a=(a0+a1)/2,r=d?R[d]:0;
  n._x=Math.round(r*Math.cos(a));n._y=Math.round(r*Math.sin(a));
  if(n.collapsed)return;
  let s=a0;
  n.children.forEach(c=>{const e=s+(a1-a0)*c._l/n._l;rad(c,s,e,d+1,R);s=e});
}
function layout(m){
  const r=m.root,L=m.layout;
  if(L=='radial'){const R=radR(r);rad(r,-Math.PI/2,Math.PI*1.5,0,R);return}
  if(L=='map'){
    r._x=0;r._y=0;if(r.collapsed)return;
    const k=r.children,h=Math.ceil(k.length/2);
    [[k.slice(0,h),1],[k.slice(h),-1]].forEach(([g,s])=>{
      if(!g.length)return;
      g.forEach(c=>sub(c,0));
      let o=-g.reduce((a,c)=>a+c._s,0)/2;
      g.forEach(c=>{place(c,s*(r._w/2+58+c._w/2),o,s,0);o+=c._s});
    });
    return;
  }
  const t=L=='down'?1:0;
  sub(r,t);place(r,0,-r._s/2,1,t);
}

function fmode(n,d,o){
  let f=n.fill||(o.fl==1?'solid':o.fl==2?'line':'');
  if(f=='solid'&&d<2&&(!o.ns||o.ns=='grad'||o.ns=='flat'))f='';
  return f;
}
const fcls=(n,d,o)=>{const f=fmode(n,d,o);return f?' fill-'+f:''};
const offs=r=>walk(r,0,null,(n,d,p)=>{
  n._ex=(p?p._ex:0)+(n.ox||0);n._ey=(p?p._ey:0)+(n.oy||0);
  n._x=Math.round(n._x+n._ex);n._y=Math.round(n._y+n._ey);
});
const clrOff=()=>{const f=n=>{n.ox=0;n.oy=0;n.children.forEach(f)};f(cur().root)};

/* Build path string between two points */
const r1=v=>Math.round(v*10)/10;
function pathBetween(a,b,x,y,layout,ln){
  a=r1(a);b=r1(b);x=r1(x);y=r1(y);
  if(layout=='radial'){
    const rp=Math.hypot(a,b),rc=Math.hypot(x,y)||1;
    return `M${a} ${b}Q${r1(x*rp/rc)} ${r1(y*rp/rc)} ${x} ${y}`;
  }
  if(ln===1)return `M${a} ${b}L${x} ${y}`;
  if(ln===2){
    if(layout=='down'){const h=r1((b+y)/2);return `M${a} ${b}V${h}H${x}V${y}`}
    const h=r1((a+x)/2);return `M${a} ${b}H${h}V${y}H${x}`;
  }
  if(layout=='down'){const h=r1((b+y)/2);return `M${a} ${b}C${a} ${h} ${x} ${h} ${x} ${y}`}
  const h=r1((a+x)/2);return `M${a} ${b}C${h} ${b} ${h} ${y} ${x} ${y}`;
}

const NT=()=>3;
const lw=(d,o)=>o.ns=='nat'?NT(d):(d==1?4:d==2?3:2.2);
function natPath(p,n,d,lay,o){
  const base=pathBetween(...anch(p,n,d,lay,o),lay,o.ln||0);
  if(fmode(n,d,o))return base;
  if(lay=='down')return base+`M${r1(n._x-n._w/2)} ${r1(n._y+n._h/2-NT()/2)}H${r1(n._x+n._w/2)}`;
  return base+`H${r1(n._x+(n._x>=p._x?1:-1)*n._w/2)}`;
}

function doImport(tx){
  tx=(tx||'').trim();
  if(!tx){toast('Вставьте данные для импорта');return}
  if(tx[0]==='{' || tx[0]==='['){
    try{
      let data=JSON.parse(tx);
      // support full map object or array of maps or just root tree
      let m;
      if(Array.isArray(data)){
        // array of maps — take first or import all
        data.forEach((item,i)=>{
          const map=normalizeMap(item);
          S.maps.push(map);
          if(i===0)m=map;
        });
      }else if(data.root || data.maps){
        // full state or single map
        if(data.maps){
          data.maps.forEach((item,i)=>{const map=normalizeMap(item);S.maps.push(map);if(i===0)m=map});
        }else m=normalizeMap(data);
      }else if(data.text!==undefined || data.children){
        // bare root node
        m=mkMap(data.text||'Импорт', data);
        m.root=data; if(!m.root.id)m.root.id=uid();
      }else{
        m=normalizeMap(data);
      }
      if(!m){toast('Не удалось разобрать JSON');return}
      $('md').hidden=true;
      open(m.id);save();
      toast('Карта импортирована');
    }catch(e){console.error(e);toast('Неверный JSON: '+e.message)}
    return;
  }
  // Markdown / outline import
  const lines=tx.split(/\r?\n/);
  const vr=T('Импорт'),stack=[{i:-1,n:vr}];
  lines.forEach(l=>{
    if(!l.trim())return;
    const i=l.match(/^\s*/)[0].replace(/\t/g,'  ').length;
    let text=l.trim().replace(/^[-*•]\s+/,'').replace(/^\d+\.\s+/,'');
    if(!text)return;
    const c=T(text);
    while(stack.length>1&&stack[stack.length-1].i>=i)stack.pop();
    stack[stack.length-1].n.children.push(c);
    stack.push({i,n:c});
  });
  if(!vr.children.length){toast('Не удалось разобрать структуру');return}
  const m=mkMap(vr.children.length===1?vr.children[0].text:'Импорт', vr.children.length===1?vr.children[0]:vr);
  S.maps.push(m);
  $('md').hidden=true;
  open(m.id);save();
  toast('Карта импортирована из Markdown');
}
function normalizeMap(raw){
  const m={
    id:uid(),
    name:raw.name||raw.root?.text||'Импорт',
    layout:raw.layout||'map',
    root:raw.root||raw,
    view:raw.view||null,
    o:Object.assign({},DF,raw.o||{}),
    links:Array.isArray(raw.links)?raw.links:[]
  };
  // ensure ids on nodes
  const fix=(n)=>{if(!n.id)n.id=uid();(n.children||[]).forEach(fix)};
  fix(m.root);
  return m;
}
/* Pointer */
const pts=new Map();let dr=null,pc=null,panRAF=0,panVelocity={x:0,y:0};
const stopPan=()=>{if(panRAF)cancelAnimationFrame(panRAF);panRAF=0};
const glide=()=>{
  stopPan();let vx=panVelocity.x,vy=panVelocity.y,prev=performance.now();
  if(Math.hypot(vx,vy)<.1)return;
  const tick=now=>{
    const dt=Math.min(32,now-prev);prev=now;
    const decay=Math.pow(.9,dt/16.67);vx*=decay;vy*=decay;
    v.x+=vx*dt;v.y+=vy*dt;apply();
    if(Math.hypot(vx,vy)>.1)panRAF=requestAnimationFrame(tick);else panRAF=0;
  };
  panRAF=requestAnimationFrame(tick);
};

st.onpointerdown=e=>{
  if(e.target.isContentEditable)return;
  stopPan();st.classList.add('is-interacting');
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size==2){
    const[a,b]=[...pts.values()];
    pc={d:Math.max(1,Math.hypot(a[0]-b[0],a[1]-b[1])),k:v.k};dr=null;return;
  }
  const ne=e.target.closest('.n'),id=ne&&ne.dataset.id;
  /* open link on node if has href and meta/ctrl click */
  if(id&&(e.metaKey||e.ctrlKey)){
    const n=nodeById(id);
    if(n?.href){window.open(n.href.startsWith('http')?n.href:'https://'+n.href,'_blank');return}
  }
  dr={id,sid:id,sx:e.clientX,sy:e.clientY,ox:v.x,oy:v.y,mv:0,lastX:e.clientX,lastY:e.clientY,lastT:performance.now()};
  try{st.setPointerCapture(e.pointerId)}catch(_){}
};
st.onpointermove=e=>{
  if(!pts.has(e.pointerId))return;
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pc&&pts.size==2){
    const[a,b]=[...pts.values()];
    zoom(pc.k*Math.hypot(a[0]-b[0],a[1]-b[1])/pc.d,(a[0]+b[0])/2,(a[1]+b[1])/2);
    return;
  }
  if(!dr)return;
  const dx=e.clientX-dr.sx,dy=e.clientY-dr.sy;
  if(!dr.mv&&Math.hypot(dx,dy)>5)dr.mv=1;
  if(!dr.mv)return;
  if(dr.id&&!linkFrom){
    const el=$('world').querySelector(`[data-id="${dr.id}"]`);
    if(el){el.classList.add('dragging');el.style.transform=`translate(${dx/v.k}px,${dy/v.k}px)`}
  }else if(!dr.id){
    const now=performance.now(),dt=Math.max(1,now-dr.lastT);
    panVelocity={x:(e.clientX-dr.lastX)/dt,y:(e.clientY-dr.lastY)/dt};
    dr.lastX=e.clientX;dr.lastY=e.clientY;dr.lastT=now;
    v.x=dr.ox+dx;v.y=dr.oy+dy;apply();
  }
};
st.onpointerup=st.onpointercancel=e=>{
  pts.delete(e.pointerId);st.classList.remove('is-interacting');
  if(pc){if(pts.size<2)pc=null;dr=null;return}
  if(!dr)return;
  const d=dr;dr=null;
  if(!d.mv){
    if(linkFrom){
      if(d.sid)finishLink(d.sid);
      else{linkFrom=null;render()}
      return;
    }
    const now=Date.now();
    if(d.sid&&lastTap.id==d.sid&&now-lastTap.t<380)ned=d.sid;
    lastTap={id:d.sid,t:now};
    sel=d.sid||null;showMedia=false;render();return;
  }
  if(d.id&&!linkFrom){
    panVelocity={x:0,y:0};
    const el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest('.n');
    const a=find(d.id);
    // desired absolute world position after the drag
    const wantX = a.n._x + (e.clientX - d.sx) / v.k;
    const wantY = a.n._y + (e.clientY - d.sy) / v.k;
    if(t&&t.dataset.id!=d.id&&a.p){
      const b=find(t.dataset.id);
      if(b&&!find(b.n.id,a.n)){
        // reparent, then set ox/oy so the node keeps the same absolute place
        mut(()=>{
          a.p.children.splice(a.p.children.indexOf(a.n),1);
          b.n.children.push(a.n);
          b.n.collapsed=false;
          // temporary layout under new parent to know base position
          const m=cur();
          prep(m.root); layout(m);
          // clear old offsets first for accurate base
          a.n.ox=0; a.n.oy=0;
          walk(m.root,0,null,(n,d,p)=>{
            n._ex=(p?p._ex:0)+(n.ox||0); n._ey=(p?p._ey:0)+(n.oy||0);
            n._x=Math.round(n._x+n._ex); n._y=Math.round(n._y+n._ey);
          });
          // now set offsets so final position == wantX/wantY
          a.n.ox = wantX - a.n._x;
          a.n.oy = wantY - a.n._y;
        });
        return;
      }
    }
    // normal free move: accumulate delta into ox/oy
    mut(()=>{
      a.n.ox = (a.n.ox||0) + (e.clientX - d.sx) / v.k;
      a.n.oy = (a.n.oy||0) + (e.clientY - d.sy) / v.k;
    });
  }else if(!d.id){save();glide()}
};

document.onkeydown=e=>{
  if(e.key==='Escape'&&linkFrom){linkFrom=null;render();return}
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;
  const k=e.key;
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()=='z'){e.preventDefault();go(e.shiftKey?1:-1);return}
  if(!sel||cur().layout=='list')return;
  if(k=='Tab'){e.preventDefault();act('child',sel)}
  else if(k=='Enter'){e.preventDefault();act('sib',sel)}
  else if(k=='Delete'||k=='Backspace')act('del',sel)
  else if(k=='F2')act('edit',sel)
  else if(k==' '){e.preventDefault();act('col',sel)}
  else if(k=='l'||k=='L')act('link',sel)
};

/* ─── EXPORT with real lines ─── */
function wrap(n,d){
  const fs=n.fs||BASE(d);ctx.font=`${n.bold?700:(d?d==1?600:500:700)} ${fs}px ${FT()}`;
  const mw=n._w-(d?34:50),L=[];let s='';
  n.text.split(' ').forEach(w=>{const t=s?s+' '+w:w;if(s&&ctx.measureText(t).width>mw){L.push(s);s=w}else s=t});
  L.push(s);return L;
}

function buildExportPaths(m,o){
  let P='';
  const r=m.root;
  walk(r,0,null,(n,d,p)=>{
    if(!p)return;
    const q=edgeD(p,n,d,m.layout,o);
    P+=`<path d="${q}" fill="none" stroke="${n._c}" stroke-width="${lw(d,o)}" stroke-linecap="${o.ns=='nat'?'butt':'round'}"/>`;
  });
  const posMap={};walk(r,0,null,n=>{posMap[n.id]=n});
  (m.links||[]).forEach(L=>{
    const A=posMap[L.from],B=posMap[L.to];
    if(!A||!B)return;
    const q=pathBetween(A._x,A._y,B._x,B._y,m.layout,1);
    const col=L.color||'#64d2ff';
    P+=`<path d="${q}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arrow)"/>`;
    if(L.label){
      const mx=Math.round((A._x+B._x)/2),my=Math.round((A._y+B._y)/2);
      P+=`<text x="${mx}" y="${my-6}" text-anchor="middle" font-size="11" fill="${col}">${esc(L.label)}</text>`;
    }
  });
  return P;
}

function toSVG(){
  const m=cur(),Ly=m.layout;
  if(Ly=='list'){m.layout='map';render()}
  const r=m.root,o=O(),cs=getComputedStyle(document.documentElement),g=k=>cs.getPropertyValue(k).trim();
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  walk(r,0,null,n=>{a=Math.min(a,n._x-n._w/2);c=Math.max(c,n._x+n._w/2);b=Math.min(b,n._y-n._h/2);d=Math.max(d,n._y+n._h/2)});
  const M=50,W=Math.round(c-a+2*M),H=Math.round(d-b+2*M),B=BGS[o.bg||0],ft=FT();
  let s=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  s+=`<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${B[1]||g('--bg')}"/><stop offset="1" stop-color="${B[2]||g('--bg')}"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64d2ff"/></marker>
  </defs>`;
  s+=`<rect width="${W}" height="${H}" fill="${o.bgc||'url(#bg)'}"/>`;
  if(o.bgi)s+=`<image href="${o.bgi}" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice"/>`;
  s+=`<g transform="translate(${M-a} ${M-b})">`;
  /* lines first */
  s+=`<g fill="none" stroke-linecap="round" opacity=".9">${buildExportPaths(m,o)}</g>`;
  /* nodes */
  walk(r,0,null,(n,depth)=>{
    const rx=(o.sh=='p'||o.sh=='c')?n._h/2:o.sh=='b'?3:depth?14:22;
    const dc=depth?shade(n._c,o.dk||0):n._c,tc=lum(dc)>.6?'#121214':'#fff';
    const T2=wrap(n,depth),fs=n.fs||BASE(depth),lh=fs*1.3;
    const x=n._x-n._w/2,y=n._y-n._h/2;
    const R=`x="${x}" y="${y}" width="${n._w}" height="${n._h}" rx="${rx}"`;
    const nat=o.ns=='nat',fm=fmode(n,depth,o),solid=fm=='solid'||(fm!='line'&&depth<2&&!nat),fc=n.tc||(solid?tc:g('--fg'));
    if(nat&&depth&&!fm){}
    else if(solid)s+=`<rect ${R} fill="${dc}"/>`;
    else if(fm=='line')s+=`<rect ${R} fill="${g('--pn')}"/><rect ${R} fill="none" stroke="${n._c}" stroke-width="2"/>`;
    else{s+=`<rect ${R} fill="${g('--pn')}"/><rect ${R} fill="${n._c}" fill-opacity=".12" stroke="${n._c}" stroke-width="1.2"/>`}
    let ty=n._y;
    if(n.icon||n.img||n.href){
      /* approximate vertical stack centering */
      let contentH=T2.length*lh;
      if(n.icon)contentH+=fs*1.15+4;
      if(n.img)contentH+=70;
      if(n.href)contentH+=14;
      ty=n._y-contentH/2+fs*.35;
      if(n.icon){s+=`<text x="${n._x}" y="${ty+fs*.5}" text-anchor="middle" font-size="${fs*1.2}">${n.icon}</text>`;ty+=fs*1.15+4}
      if(n.img){s+=`<image href="${n.img}" x="${n._x-50}" y="${ty}" width="100" height="64" preserveAspectRatio="xMidYMid slice"/><rect x="${n._x-50}" y="${ty}" width="100" height="64" rx="6" fill="none"/>`;ty+=70}
      T2.forEach((t,i)=>{s+=`<text x="${n._x}" y="${ty+i*lh+fs*.35}" text-anchor="middle" font-family="${ft}" font-size="${fs}" font-weight="${n.bold?700:(depth?depth==1?600:500:700)}" fill="${fc}">${esc(t)}</text>`});
      ty+=T2.length*lh;
      if(n.href)s+=`<text x="${n._x}" y="${ty+12}" text-anchor="middle" font-size="10" fill="${fc}" opacity=".7">${esc(n.href.replace(/^https?:\/\//,''))}</text>`;
    }else{
      T2.forEach((t,i)=>s+=`<text x="${n._x}" y="${n._y+(i-(T2.length-1)/2)*lh+fs*.35}" text-anchor="middle" font-family="${ft}" font-size="${fs}" font-weight="${n.bold?700:(depth?depth==1?600:500:700)}" fill="${fc}">${esc(t)}</text>`);
    }
  });
  s+='</g></svg>';
  if(Ly=='list'){m.layout=Ly;render()}
  return{s,W,H};
}

function toCanvas(f){
  const{s,W,H}=toSVG();
  const im=new Image();
  im.onload=()=>{
    const c=document.createElement('canvas');c.width=W*2;c.height=H*2;
    const x=c.getContext('2d');x.scale(2,2);x.drawImage(im,0,0,W,H);f(c);
  };
  im.onerror=()=>toast('Ошибка экспорта');
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}

function mkPdf(j,iw,ih){
  const e=new TextEncoder(),P=[],off=[],w=iw/2,h=ih/2;let len=0;
  const add=b=>{if(typeof b=='string')b=e.encode(b);P.push(b);len+=b.length};
  const ob=(i,s,bin)=>{off[i]=len;add(`${i} 0 obj\n${s}`);if(bin){add(bin);add(`\nendstream`)}add(`\nendobj\n`)};
  add(`%PDF-1.4\n`);
  ob(1,'<</Type/Catalog/Pages 2 0 R>>');ob(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
  ob(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${w} ${h}]/Contents 4 0 R/Resources<</XObject<</I 5 0 R>>>>>>`);
  const c=`q ${w} 0 0 ${h} 0 0 cm /I Do Q`;
  ob(4,`<</Length ${c.length}>>stream\n${c}\nendstream`);
  ob(5,`<</Type/XObject/Subtype/Image/Width ${iw}/Height ${ih}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${j.length}>>stream\n`,j);
  const x=len;
  add(`xref\n0 6\n0000000000 65535 f \n`+[1,2,3,4,5].map(i=>String(off[i]).padStart(10,'0')+` 00000 n \n`).join('')+`trailer<</Size 6/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`);
  return new Blob(P,{type:'application/pdf'});
}

const bnd=r=>{let a=1e9,b=1e9,c=-1e9,d=-1e9;walk(r,0,null,n=>{a=Math.min(a,n._x-n._w/2);c=Math.max(c,n._x+n._w/2);b=Math.min(b,n._y-n._h/2);d=Math.max(d,n._y+n._h/2)});return{a,b,c,d}};
let _probe;
function safeInset(side){
  if(!_probe){_probe=document.createElement('div');_probe.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none';document.body.appendChild(_probe)}
  _probe.style.paddingTop=side==='top'?'var(--sat2,env(safe-area-inset-top,0px))':'env(safe-area-inset-bottom,0px)';
  return parseFloat(getComputedStyle(_probe).paddingTop)||0;
}
const AR=()=>{

  const sat=safeInset('top'), sab=safeInset('bottom');
  const top=56+sat, bot=70+sab;
  return{W:R.width,T:top,H:Math.max(50,R.height-top-bot)};

const fk=()=>{if(!bb)return 1;const A=AR();return Math.min(A.W/(bb.c-bb.a+48),A.H/(bb.d-bb.b+48))};
function clampV(){
  if(!bb||st.hidden)return;
  const A=AR();
  v.k=Math.min(4,Math.max(.03,v.k));
  const k=v.k,M=80;
  /* карта может уходить за край, но минимум M px всегда остаются на экране */
  const f=(mn,mx,s,sz,p)=>Math.min(s+sz-M-mn*k,Math.max(s+M-mx*k,p));
  v.x=f(bb.a,bb.c,0,A.W,v.x);
  v.y=f(bb.b,bb.d,A.T,A.H,v.y);
}
function fit(){
  if(!bb)return;
  const A=AR();
  v.k=Math.min(2,fk());
  v.x=A.W/2-(bb.a+bb.c)/2*v.k;v.y=A.T+A.H/2-(bb.b+bb.d)/2*v.k;
  smooth();apply();
}
function zoom(k,cx,cy){
  k=Math.max(.03,Math.min(4,k));
  const R=st.getBoundingClientRect(),px=cx-R.left,py=cy-R.top;
  v.x=px-(px-v.x)*k/v.k;v.y=py-(py-v.y)*k/v.k;v.k=k;apply();
}

/* ─── Style gallery ─── */
const PDEF={ns:'flat',sh:'r',ln:0,fl:0,pal:'bright',dk:0};
const PRESETS=[
  {id:'bright',n:'Яркие цвета',o:{sh:'p',fl:1,pal:'bright',dk:.45}},
  {id:'soft',n:'Мягкие цвета',o:{sh:'p',fl:2,pal:'bright'}},
  {id:'nat',n:'Натуральный + цвета',o:{ns:'nat',pal:'rainbow'}},
  {id:'steel',n:'Голубая сталь',o:{sh:'p',fl:1,pal:'steel',dk:.35}},
  {id:'aqua',n:'Аква',o:{sh:'p',fl:1,pal:'aqua',dk:.4}},
  {id:'spring',n:'Весенний',o:{sh:'p',fl:2,pal:'spring'}},
  {id:'gray',n:'Натуральный серый',o:{ns:'nat',pal:'gray'}},
  {id:'pastel',n:'Пастельные тона',o:{sh:'p',fl:1,pal:'pastel',dk:.6}},
  {id:'gold',n:'Золотистые цвета',o:{sh:'p',fl:2,pal:'gold'}},
  {id:'circles',n:'Цветные круги',o:{sh:'c',fl:1,pal:'circles'}},
  {id:'table',n:'Таблица',o:{sh:'b',ln:2,fl:1,pal:'steel',dk:.3}},
  {id:'bw',n:'Чёрно-белый',o:{sh:'b',fl:2,pal:'mono'}},
  {id:'right',n:'Мягкие цвета · вправо',o:{sh:'p',fl:2,pal:'bright'},lay:'right'}
];
function thumb(p){
  const P=PALS[p.pal]||PALS.bright,nat=p.ns=='nat',circ=p.sh=='c',line=p.fl==2,cx=160,cy=93;
  const TT=()=>2.2;
  const SZ=circ?[[30,30],[24,24],[19,19]]:[[52,22],[44,17],[36,14]];
  const br=[['Идеи',1,-1],['Цели',1,0],['План',1,1],['Люди',-1,-1],['Сроки',-1,0],['Риски',-1,1]];
  let L='',N='';
  const edge=(px,py,pd,x,y,d,col,sd)=>{
    const ph=SZ[pd][1],h=SZ[d][1];
    const a=nat?[pd?px+sd*SZ[pd][0]/2:px,pd?py+ph/2-TT(pd)/2:py]:[px,py],c=nat?[x-sd*SZ[d][0]/2,y+h/2-TT(d)/2]:[x,y];
    const w=nat?TT(d):(d==1?2.4:1.5);
    L+=`<path d="${pathBetween(a[0],a[1],c[0],c[1],'map',p.ln)}${nat?'H'+r1(x+sd*SZ[d][0]/2):''}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="${nat?'butt':'round'}"/>`;
  };
  const node=(x,y,d,col,t)=>{
    const[w,h]=SZ[d],fs=[8.5,7.5,6.5][d],dc=d?shade(col,p.dk||0):col;
    const rx=(circ||p.sh=='p')?h/2:p.sh=='b'?1.5:4,R=`x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${rx}"`;
    let tc;
    if(nat&&d){tc='#eee'}
    else if(line||nat){N+=`<rect ${R} fill="#181818" stroke="${col}" stroke-width="1.4"/>`;tc='#eee'}
    else{N+=`<rect ${R} fill="${dc}"/>`;tc=lum(dc)>.6?'#111':'#fff'}
    N+=`<text x="${x}" y="${y+fs*.36}" text-anchor="middle" font-size="${fs}" font-weight="${d<2?600:500}" fill="${tc}">${t}</text>`;
  };
  node(cx,cy,0,P.r,'Карта');
  br.forEach(([t,sd,row],i)=>{
    const col=P.b[i%P.b.length],bx=cx+sd*74,by=cy+row*54;
    edge(cx,cy,0,bx,by,1,col,sd);node(bx,by,1,col,t);
    [-1,1].forEach((k,j)=>{const lx=cx+sd*134,ly=by+k*14,lc=P.l||col;edge(bx,by,1,lx,ly,2,lc,sd);node(lx,ly,2,lc,j?'Два':'Раз')});
  });
  return `<svg viewBox="0 0 320 186" width="320" height="186" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">${L}${N}</svg>`;
}
function sgRender(){
  const c=O().st;
  $('sgl').innerHTML=PRESETS.map(P=>`<div class="sc ${c==P.id?'on':''}" data-p="${P.id}">${thumb({...PDEF,...P.o})}<span>${P.n}</span></div>`).join('');
}
function applyPreset(id){
  const P=PRESETS.find(x=>x.id==id);if(!P)return;
  const m=cur(),o=O();
  Object.assign(o,PDEF,P.o,{st:id});
  if(P.lay) m.layout=P.lay;
  else if(m.layout=='list') m.layout='map';
  // keep ox/oy — user positions stay
  render();fit();save();toast('Стиль: '+P.n);
}
$('sty').onclick=()=>{sgRender();$('sg').hidden=false};
$('sgb').onclick=()=>{$('sg').hidden=true};
$('sgl').onclick=e=>{const c=e.target.closest('[data-p]');if(c){$('sg').hidden=true;applyPreset(c.dataset.p)}};

open(S.cur&&S.maps.some(m=>m.id==S.cur)?S.cur:S.maps[0].id);
